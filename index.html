<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verko — We'll be right back</title>
<meta name="description" content="Verko is undergoing scheduled changes. We'll be back online shortly.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0f0f'/%3E%3Ctext x='50' y='62' font-family='Inter,Arial,sans-serif' font-size='52' font-weight='800' fill='%23ffffff' text-anchor='middle'%3EV%3C/text%3E%3Ccircle cx='78' cy='66' r='8' fill='%23ef5350'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --fg:#0f0f0f;
    --muted:#6b7280;
    --line:#e5e7eb;
    --line-strong:#d1d5db;
    --accent:#0f0f0f;
    --accent-fg:#ffffff;
    --field-bg:#f9fafb;
    --bar-bg:rgba(255,255,255,0.85);
    --dot:#ef5350;
    --shadow:rgba(0,0,0,0.14);
    --ease:cubic-bezier(.16,.8,.24,1);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#0f1012; --fg:#f3f4f6; --muted:#9ca3af; --line:#2a2d31; --line-strong:#3a3e44;
    --accent:#f3f4f6; --accent-fg:#0f1012; --field-bg:#1b1d21;
    --bar-bg:rgba(20,21,24,0.82); --shadow:rgba(0,0,0,0.55);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#0f1012; --fg:#f3f4f6; --muted:#9ca3af; --line:#2a2d31; --line-strong:#3a3e44;
      --accent:#f3f4f6; --accent-fg:#0f1012; --field-bg:#1b1d21;
      --bar-bg:rgba(20,21,24,0.82); --shadow:rgba(0,0,0,0.55);
      color-scheme:dark;
    }
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.5;font-size:16px;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .container{max-width:1180px;margin-inline:auto;padding-inline:clamp(1.1rem,5vw,2.5rem);width:100%;}

  .logo{font-weight:800;letter-spacing:-.5px;display:inline-flex;align-items:center;font-size:1.4rem;}
  .logo .dot{color:var(--dot);margin-left:1px;}

  .site-header{background:var(--bar-bg);border-bottom:1px solid var(--line);}
  .header-inner{display:flex;align-items:center;height:62px;}
  .header-right{margin-left:auto;}
  .icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--field-bg);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;}
  .icon-btn:hover{border-color:var(--line-strong);}

  main{flex:1;display:flex;align-items:center;}
  .hero{padding:clamp(3rem,10vw,6rem) 0;text-align:center;width:100%;}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:1.2rem;background:var(--field-bg);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;}
  .kicker .pulse{width:7px;height:7px;border-radius:50%;background:var(--dot);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .hero h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;}
  .hero h1 .accent{color:var(--dot);}
  .hero .tagline{font-size:clamp(1.02rem,2vw,1.2rem);color:var(--muted);max-width:44ch;margin:1.1rem auto 0;}
  .hero .note{font-size:.9rem;color:var(--muted);margin-top:2rem;}
  .hero .note a{font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:3px;}

  .site-footer{border-top:1px solid var(--line);background:var(--field-bg);}
  .footer-bottom{padding-block:1.2rem;display:flex;justify-content:center;font-size:.82rem;color:var(--muted);}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <span class="logo" aria-label="Verko">Verko<span class="dot">.</span></span>
    <div class="header-right">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <section class="hero">
      <p class="kicker"><span class="pulse"></span>Under construction</p>
      <h1>We're making <span class="accent">changes.</span></h1>
      <p class="tagline">Verko is temporarily offline while we rebuild. We'll be back shortly — thanks for your patience.</p>
      <p class="note">Questions? <a href="mailto:info@verko.lt">info@verko.lt</a></p>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 Verko</span>
  </div>
</footer>

<script>
  function applyTheme(t){
    if(t!=="light"&&t!=="dark"&&t!=="auto")t="auto";
    document.documentElement.setAttribute("data-theme",t);
    try{localStorage.setItem("vk_theme",t);}catch(e){}
  }
  (function(){var t;try{t=localStorage.getItem("vk_theme");}catch(e){} applyTheme(t);})();
  document.getElementById("themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    applyTheme(cur==="dark"?"light":"dark");
  });
</script>
</body>
</html>
