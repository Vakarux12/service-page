<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verko — We'll be right back</title>
<meta name="description" content="Verko is undergoing scheduled changes. We'll be back online shortly.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b1120;
    --card: #121a2e;
    --text: #f4f6fb;
    --muted: #9aa5b8;
    --accent: #6ea8fe;
    --border: #1f2a44;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(110, 168, 254, 0.12);
    border: 1px solid rgba(110, 168, 254, 0.3);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 24px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-size: 26px;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
    color: var(--text);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">Verko</div>
    <div class="badge"><span class="dot"></span>Under construction</div>
    <h1>We're making changes</h1>
    <p>Verko is temporarily offline while we work on something better. Check back soon.</p>
  </main>
</body>
</html>
